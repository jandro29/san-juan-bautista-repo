<section class="contenedor w-full h-screen overflow-hidden relative">
  <app-barra-superior></app-barra-superior>

  <div class="flex">
    <app-menu-desplegable></app-menu-desplegable>

    <div class="flex h-screen w-full bg-[#DBE0E6] items-center justify-center">
      <div class="bg-[#F6F5FF] w-[950px]">
        <div class="m-[20px]">
          <div class="flex flex-row">
            <div class="grid grid-cols-6 gap-4">
              <p class="text-[48px] font-bold col-start-1 col-end-4">
                REPORTE PAGOS
              </p>
              <button
                mat-raised-button
                class="col-span-1 bg-[#FF9800] text-white"
                (click)="exportarPDF()"
              >
                <mat-icon>picture_as_pdf</mat-icon>
                PDF
              </button>
              <button
                mat-raised-button
                class="col-span-1 bg-[#9C27B0] text-white"
                (click)="imprimir()"
              >
                <mat-icon>print</mat-icon>
                IMPRIMIR
              </button>
            </div>
          </div>

          <div class="flex w-full mt-[40px] grid">
            <div class="flex w-full flex-col">
              <mat-form-field>
                <mat-label>Filtrar por estudiante, tipo, estado...</mat-label>
                <input
                  matInput
                  (keyup)="applyFilter($event)"
                  placeholder="Ej. Juan, Matrícula, Pagado"
                  #input
                />
              </mat-form-field>

              <mat-paginator
                [pageSizeOptions]="[5, 10, 25, 100]"
                aria-label="Selector de página"
              ></mat-paginator>

              <div class="h-[370px] overflow-y-auto">
                <div class="mat-elevation-z8 w-full">
                  <table mat-table [dataSource]="dataSource" matSort>
                    <!-- ID -->
                    <ng-container matColumnDef="id">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        ID
                      </th>
                      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
                    </ng-container>

                    <!-- Estudiante -->
                    <ng-container matColumnDef="estudiante">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Estudiante
                      </th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.estudiante }}
                      </td>
                    </ng-container>

                    <!-- Tipo -->
                    <ng-container matColumnDef="tipo_pago">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Tipo
                      </th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.tipo_pago }}
                      </td>
                    </ng-container>

                    <!-- Monto -->
                    <ng-container matColumnDef="monto">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Monto
                      </th>
                      <td mat-cell *matCellDef="let row">
                        S/. {{ row.monto }}
                      </td>
                    </ng-container>

                    <!-- Estado -->
                    <ng-container matColumnDef="estado">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Estado
                      </th>
                      <td mat-cell *matCellDef="let row">{{ row.estado }}</td>
                    </ng-container>

                    <!-- Fecha de pago -->
                    <ng-container matColumnDef="fecha_pago">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Fecha Pago
                      </th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.fecha_pago || "No registrada" }}
                      </td>
                    </ng-container>

                    <!-- Fecha de vencimiento -->
                    <ng-container matColumnDef="fecha_vencimiento">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Fecha Vencimiento
                      </th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.fecha_vencimiento || "No definida" }}
                      </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr
                      mat-row
                      *matRowDef="let row; columns: displayedColumns"
                    ></tr>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="contenedor w-full h-screen overflow-hidden relative">
    <app-barra-superior></app-barra-superior>

    <div class="flex">
        <app-menu-desplegable>
        </app-menu-desplegable>

        <div class="flex h-screen w-full bg-[#DBE0E6]  flex items-center justify-center">
            <div class=" bg-[#F6F5FF] w-[950px]">
                <div class="m-[20px]">
                    <p class=" text-[48px] font-bold">ESTUDIANTES</p>
                    <div class="flex w-[100%] mt-[40px] grid ">
                        <div class="flex w-[100%] flex-col">
                            <mat-form-field>
                                <mat-label>Filter</mat-label>
                                <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
                            </mat-form-field>

                            <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"
                                aria-label="Select page of users"></mat-paginator>
                            <div class="h-[370px] overflow-y-auto">
                                <div class="mat-elevation-z8  flex w-[100%]">
                                    <table mat-table [dataSource]="dataSource" matSort>

                                        <ng-container matColumnDef="id">
                                            <th mat-header-cell *matHeaderCellDef> ID </th>
                                            <td mat-cell *matCellDef="let row"> {{ row.id }} </td>
                                        </ng-container>

                                        <ng-container matColumnDef="nombre">
                                            <th mat-header-cell *matHeaderCellDef> Nombre </th>
                                            <td mat-cell *matCellDef="let row"> {{ row.nombre }} </td>
                                        </ng-container>

                                        <ng-container matColumnDef="apellidos">
                                            <th mat-header-cell *matHeaderCellDef> Apellidos </th>
                                            <td mat-cell *matCellDef="let row"> {{ row.apellidos }} </td>
                                        </ng-container>

                                        <ng-container matColumnDef="dni">
                                            <th mat-header-cell *matHeaderCellDef> DNI </th>
                                            <td mat-cell *matCellDef="let row"> {{ row.dni }} </td>
                                        </ng-container>

                                        <ng-container matColumnDef="fecha_nacimiento">
                                            <th mat-header-cell *matHeaderCellDef> Fecha Nacimiento </th>
                                            <td mat-cell *matCellDef="let row"> {{ row.fecha_nacimiento }} </td>
                                        </ng-container>

                                        <ng-container matColumnDef="grado">
                                            <th mat-header-cell *matHeaderCellDef> Grado </th>
                                            <td mat-cell *matCellDef="let row"> {{ row.grado }} </td>
                                        </ng-container>

                                        <ng-container matColumnDef="apoderado">
                                            <th mat-header-cell *matHeaderCellDef> Apoderado </th>
                                            <td mat-cell *matCellDef="let row"> {{ row.apoderado }} </td>
                                        </ng-container>

                                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>


                                    </table>
                                </div>
                            </div>
                        </div>



                    </div>


                </div>
            </div>
        </div>
    </div>




</section>
